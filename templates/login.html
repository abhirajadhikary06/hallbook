{% extends "base.html" %}
{% block title %}Log in — HallBook{% end %}
{% block content %}
<div class="auth-wrap">
  <div class="card">
    <div class="card-body p-4">
      <h3 class="text-center mb-1">Welcome back</h3>
      <p class="auth-sub text-center">Log in to manage your bookings.</p>
      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% end %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next_url }}">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </form>
      <p class="text-center mt-3 mb-0 small text-muted">No account? <a href="/register">Sign up</a></p>
    </div>
  </div>
  <div class="demo-box mt-3 text-center">Demo: <code>admin</code>/<code>admin123</code> or <code>demo_user</code>/<code>user123</code></div>
</div>
{% end %}
